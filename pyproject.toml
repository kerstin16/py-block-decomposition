[project]
name = "py-block-decomposition"
version = "0.1.1"
description = "Tracks a pending add per block to apply range updates in O(number of blocks) instead of O(number of elements)."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
